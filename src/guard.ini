# DSH 桌宠 行为配置（改完重启桌宠生效：先 DSH-Pet.exe /stop，再双击 DSH-Pet.exe）
#
# hide_on_fullscreen = 1
#   前台出现“覆盖整块屏幕”的全屏应用（全屏游戏、全屏视频、全屏演示、F11 全屏浏览器）时，
#   自动把桌宠藏起来；离开全屏后自动恢复显示。默认开启。
#   普通最大化窗口（下面还有任务栏）不算全屏，不会隐藏。
#
# also_hide_dsh_pet = 1
#   全屏时把「DeepSeek Harness 里那只桌宠」也一起藏起来。设成 0 就只处理本文件夹这只。
#
# hide_dsh_pet_always = 1
#   桌宠运行期间【始终】隐藏 DeepSeek Harness 里那只桌宠窗口，避免两只叠在同一个角落。
#   退出本桌宠后会自动把那只恢复显示。默认开启。
#
# takeover_notifications = 1
#   桌宠运行期间接管系统通知：关闭 Windows 原生通知弹窗（任务栏右下角那种），
#   任务提示改为由桌宠气泡播报。退出桌宠后自动恢复你原来的通知设置。默认开启。
#   这一项可以热切换：右键桌宠 →「系统通知接管」→ 开启接管 / 关闭接管，立即生效，
#   不用重启（程序会改这里并重启 Windows 推送服务让开关立刻起作用）。
#   注意：系统推送服务重启要花 1~2 秒，期间通知会延迟一下，属正常。
#
# poll_ms = 500
#   检测全屏的间隔（毫秒），200~5000。越小反应越快，越费一点点点 CPU。
#
# log = 1
#   是否在同目录写 guard.log 记录“什么时候藏 / 什么时候恢复”。排查问题时有用，平时可设 0。

hide_on_fullscreen = 1
also_hide_dsh_pet = 1
hide_dsh_pet_always = 1
takeover_notifications = 1
poll_ms = 500
log = 1
